    .bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
    .bubble.zz{font-family:var(--mono);font-size:14px;color:var(--ink-2)}
    .heart{position:fixed;width:28px;height:26px;pointer-events:none;z-index:6;animation:float 1.3s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes float{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-260%) scale(.9) rotate(var(--r))}}
    .treat{position:fixed;width:44px;height:22px;pointer-events:none;z-index:7}
    .bar{display:flex;flex-direction:column;align-items:center;gap:12px}
    .stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--ink-2)}
    .stats span{padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(17,17,20,.05)}
    .stats b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
    .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
    @media (max-width:640px){.dog{height:min(50vh,440px)}.stats{font-size:12px}}
    .heart svg{width:100%;height:100%;display:block}
    @media (prefers-reduced-motion: reduce){.heart{animation-duration:.01s}}
