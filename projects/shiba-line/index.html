  <style>
    .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 16px 150px;background:radial-gradient(46% 44% at 50% 46%,rgba(208,207,238,.42),rgba(233,232,252,.16) 60%,transparent 80%),var(--page)}
    .dogwrap{position:relative;width:min(100%,calc((100svh - 220px) * .7),420px);aspect-ratio:56/80}
    .dogwrap::after{content:"";position:absolute;left:12%;right:4%;bottom:1.2%;height:5%;border-radius:50%;background:radial-gradient(closest-side,rgba(60,50,106,.2),rgba(60,50,106,0));z-index:0}
    #dog{position:relative;z-index:1;width:100%;height:100%;touch-action:none;outline:none;opacity:0;transition:opacity .6s}
    #dog.on{opacity:1}
    #dog:focus-visible{outline:2px solid var(--lilac-deep);outline-offset:6px;border-radius:12px}
    #dog svg{display:block;width:100%;height:100%;overflow:visible}
    #dog #head,#dog #head-base,#dog #ear-left,#dog #ear-right{cursor:grab}
    .fx{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
    .heart{position:absolute;width:22px;height:20px;margin:-10px 0 0 -11px;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) forwards}
    .heart svg{display:block;width:100%;height:100%}
    @keyframes rise{0%{opacity:0;transform:translateY(6px) scale(.5)}18%{opacity:1;transform:translateY(-8px) scale(1)}100%{opacity:0;transform:translate(var(--dx),-90px) scale(.85) rotate(var(--r))}}
    .zz{position:absolute;font:500 24px var(--mono);color:var(--lilac-deep);animation:zz 2.8s ease-out forwards}
    @keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.9}100%{opacity:0;transform:translate(26px,-70px) scale(1.15)}}
    .bone{position:fixed;left:0;top:0;width:52px;height:26px;margin:-13px 0 0 -26px;pointer-events:none;z-index:4;display:none}
    .bone img{display:block;width:100%;height:100%}
    .bar{position:fixed;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px;z-index:5;pointer-events:none}
    .bar>*{pointer-events:auto}
    .bar .lab-hint{margin:0;text-align:center}
    .lab-btn[disabled]{opacity:.55;cursor:default;transform:none}
    @media (prefers-reduced-motion: reduce){.heart,.zz{animation-duration:.01s}}
  </style>
